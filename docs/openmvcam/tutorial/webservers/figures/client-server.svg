<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>One HTTP exchange between a client and a server</title>
  <style>
    svg { color: #111; }
    @media (prefers-color-scheme: dark) { svg { color: #eee; } }
  </style>

  <!-- Party boxes -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="60" y="20" width="180" height="70" rx="6"/>
    <rect x="520" y="20" width="180" height="70" rx="6"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="16">
    <text x="150" y="50">client</text>
    <text x="610" y="50">server</text>
  </g>
  <g fill="currentColor" font-size="11" opacity="0.7" text-anchor="middle">
    <text x="150" y="70">camera (requests)</text>
    <text x="150" y="83">or phone, or laptop</text>
    <text x="610" y="70">camera (microdot)</text>
    <text x="610" y="83">or cloud API</text>
  </g>

  <!-- Lifelines -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.35">
    <line x1="150" y1="90" x2="150" y2="285"/>
    <line x1="610" y1="90" x2="610" y2="285"/>
  </g>

  <!-- Request arrow (right) -->
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="380" y="130">1. request (method, path, headers, body)</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <line x1="150" y1="145" x2="602" y2="145"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="602,141 602,149 610,145"/>
  </g>

  <!-- Response arrow (left) -->
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="380" y="190">2. response (status, headers, body)</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <line x1="610" y1="205" x2="158" y2="205"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="158,201 158,209 150,205"/>
  </g>

  <!-- Transport annotation: dashed band -->
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
    <line x1="80" y1="245" x2="680" y2="245"/>
  </g>
  <g fill="currentColor" font-size="11" opacity="0.75" text-anchor="middle">
    <text x="380" y="270">TCP (or TLS-wrapped TCP)</text>
  </g>
</svg>
