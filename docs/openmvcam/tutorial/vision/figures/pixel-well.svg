<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 560 200"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <title>Photodiode well filling with charge</title>
  <style>
    svg { color: #111; }
    @media (prefers-color-scheme: dark) { svg { color: #eee; } }
  </style>

  <!-- Three wells side by side. All have the same outline (same
       full-well capacity); each is filled to a different level
       representing how much charge a different scene puts in the
       well during the same exposure time. -->

  <!-- Well 1: dim scene, about 20% fill -->
  <rect x="80" y="172" width="80" height="28" fill="currentColor" opacity="0.3"/>
  <rect x="80" y="60" width="80" height="140" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="120" y="220" fill="currentColor" text-anchor="middle">dim scene</text>

  <!-- Well 2: bright scene, about 80% fill -->
  <rect x="240" y="88" width="80" height="112" fill="currentColor" opacity="0.3"/>
  <rect x="240" y="60" width="80" height="140" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="280" y="220" fill="currentColor" text-anchor="middle">bright scene</text>

  <!-- Well 3: too-bright scene, well saturated (fill reaches the top) -->
  <rect x="400" y="60" width="80" height="140" fill="currentColor" opacity="0.3"/>
  <rect x="400" y="60" width="80" height="140" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="440" y="220" fill="currentColor" text-anchor="middle">saturated</text>
</svg>
