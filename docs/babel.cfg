# Babel extraction config for the Jinja2 HTML templates under templates/.
#
# Sphinx's `sphinx-build -b gettext` does NOT extract template strings, only
# document content. The home page (templates/topindex.html) wraps its visible
# text in _() / {% trans %}, so those strings are pulled out with pybabel into
# the "sphinx" message domain, which Sphinx loads for template translation:
#
#   pybabel extract -F babel.cfg -o locale/sphinx.pot --no-location .
#   sphinx-intl update -p locale -d locale -l <lang> ...   # makes sphinx.po
#   # translate locale/<lang>/LC_MESSAGES/sphinx.po, then build:
#   sphinx-build -b html -D language=<lang> . build/html/<lang>
#
# Sphinx auto-compiles sphinx.po -> sphinx.mo at build time (gettext_auto_build),
# and the template _() / {% trans %} calls resolve from it. Run pybabel from the
# docs/ root (patterns below are relative to that root).
[jinja2: templates/**/*.html]
[jinja2: templates/*.html]
encoding = utf-8
extensions = jinja2.ext.i18n
